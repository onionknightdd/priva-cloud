[project]
name = "priva-channel-connector"
version = "0.0.0"
description = "Priva Cloud channel-connector: always-on Feishu WS byte-path. Holds one lark_oapi long-connection per effective account (Model B, thread-per-app), reconciles the effective set off the dataplane (poll desired_digest), and relays DM ⇄ ar-{account} /run/stream. The pod makes no IM calls — the connector owns the socket."
requires-python = ">=3.11"
dependencies = [
    "priva-common",
    "fastapi",               # internal API (:8083 /internal/reconcile, /healthz, /metrics)
    "uvicorn",
    "httpx",                 # dial the runner pod (/run/stream SSE) + Feishu REST fallback
    "kubernetes",            # waker: patch AgentTenant spec.wake + poll status (copied from scheduler)
    "grpcio",                # dataplane transport (client side)
    "python-jose",           # runner-token mint/verify (priva_common.runner_token)
    "lark-oapi>=1.7,<2",     # Feishu/Lark WS + IM REST; lark_ws relies on 1.7 internals (_disconnect/_auto_reconnect/reconnect hooks), verified on 1.7.1
]

[project.entry-points."priva_cloud.services"]
channel-connector = "priva_channel_connector.entry:main"

[tool.uv.sources]
priva-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priva_channel_connector"]
