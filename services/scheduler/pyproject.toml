[project]
name = "priva-scheduler"
version = "0.0.0"
description = "Priva Cloud scheduler: leaderless APScheduler clock over the dataplane job set — claim (exactly-once) → wake (AgentTenant CR) → dial (pod admission). Executes nothing itself."
requires-python = ">=3.11"
dependencies = [
    "priva-common",
    "apscheduler>=3.10,<4",  # trigger math + the per-replica clock
    "fastapi",               # internal API (:8082 /internal/trigger, /healthz, /metrics)
    "uvicorn",
    "httpx",                 # dial the runner pod (admission POST)
    "kubernetes",            # waker: patch AgentTenant spec.wake + poll status
    "grpcio",                # dataplane transport (client side)
    "PyJWT[crypto]>=2.13,<3",  # runner-token minting (priva_common.runner_token)
]

[project.entry-points."priva_cloud.services"]
scheduler = "priva_scheduler.entry:main"

[tool.uv.sources]
priva-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/priva_scheduler"]
