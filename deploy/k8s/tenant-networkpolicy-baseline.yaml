# Static default-deny baselines. The operator's managed NetworkPolicies add only
# the current allowed paths; deleting them therefore fails closed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: priva-tenant-runner-baseline
  namespace: priva-cloud
  labels:
    app.kubernetes.io/managed-by: priva-deploy
    priva.io/policy-set: tenant-isolation-baseline
spec:
  podSelector:
    matchLabels:
      app: agent-runner
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: priva-tenant-terminal-baseline
  namespace: priva-cloud
  labels:
    app.kubernetes.io/managed-by: priva-deploy
    priva.io/policy-set: tenant-isolation-baseline
spec:
  podSelector:
    matchLabels:
      app: terminal
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: priva-tenant-egress-proxy-baseline
  namespace: priva-cloud
  labels:
    app.kubernetes.io/managed-by: priva-deploy
    priva.io/policy-set: tenant-isolation-baseline
spec:
  podSelector:
    matchLabels:
      app: egress-proxy
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
