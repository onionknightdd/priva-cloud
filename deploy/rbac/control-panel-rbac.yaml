# RBAC for control-panel: provision AgentTenant CRs + read their status (EPP wake)
# + scale a deployment to zero (admin terminate).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: priva-control-panel
  namespace: priva-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: priva-control-panel
  namespace: priva-cloud
rules:
  - apiGroups: ["priva.io"]
    resources: ["agenttenants", "agenttenants/status"]
    # delete: account purge — dropping the CR is what hands teardown to the operator
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    # delete: admin force-restart of an account's agent-runner pod (ReplicaSet recreates it)
    verbs: ["get", "list", "delete"]
  # Admin control-plane web terminal: exec a shell into control-plane pods
  # (control-panel / operator / data-spine) via the k8s API. Admin-gated, audited.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # Read-only: the admin Isolation panel reports MEASURED state, not intent.
  # Listing policies is how it distinguishes "the admin asked for this" from
  # "the operator actually wrote it" — drift that is otherwise invisible.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  # priva-cluster-facts caches the CNI-enforcement probe result; whether the CNI
  # drops the packet cannot be read from any API, only measured.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  # Read live agent-runner CPU/memory (metrics-server) for the Resource Quota view.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: priva-control-panel
  namespace: priva-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: priva-control-panel
subjects:
  - kind: ServiceAccount
    name: priva-control-panel
    namespace: priva-cloud
---
# Cluster-scoped: list node images (Node.status.images) to discover available
# agent-runner image tags for the admin Sandbox panel's image dropdown. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: priva-control-panel-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: priva-control-panel-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: priva-control-panel-nodes
subjects:
  - kind: ServiceAccount
    name: priva-control-panel
    namespace: priva-cloud
