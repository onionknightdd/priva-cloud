# /api/sandbox/* -> InferencePool (EPP steers to the account's pod); everything else
# (SPAs at / and /sandbox, /admin, /api/auth, /api/admin, /api/resource/models, and the
# /sandbox/apidocs API reference which control-panel proxies from a runner) ->
# control-panel HTTP face. Most-specific path wins, so /api/sandbox beats the "/" catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: priva-routes
  namespace: priva-cloud
spec:
  parentRefs:
    - name: priva-gateway
  rules:
    - matches:
        # All agent-runner runtime API lives under one namespace, so a single prefix
        # steers it to the account's pod (the EPP picks the endpoint). /api/resource/models
        # is NOT here — it's a pure control-plane proxy that stays on the "/" catch-all.
        # A cold sandbox 503s here at the EPP until the pod answers; the SPA polls
        # /api/sandbox/health to drive the waking/ready toasts and render the first page.
        # (/sandbox/apidocs is NOT here — control-panel serves it by proxying the OpenAPI
        # schema from a ready runner, so it rides the "/" catch-all. The EPP/GIE path
        # buffers response bodies ~8KB, which would truncate the 91KB schema.)
        - path: {type: PathPrefix, value: /api/sandbox}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: agent-runners
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: control-panel
          port: 8080
