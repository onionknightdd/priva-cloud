{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agenttenants.priva.io
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
  {{- if .Values.crds.keep }}
  annotations:
    # Survive `helm uninstall` so removing the release never deletes live AgentTenant CRs.
    "helm.sh/resource-policy": keep
  {{- end }}
spec:
  group: priva.io
  scope: Namespaced
  names:
    plural: agenttenants
    singular: agenttenant
    kind: AgentTenant
    shortNames: [at]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Account
          type: string
          jsonPath: .spec.accountId
        - name: Runner
          type: string
          jsonPath: .spec.agentRunnerType
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: PodIP
          type: string
          jsonPath: .status.podIP
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [accountId, username]
              x-kubernetes-validations:
                - rule: self.accountId == oldSelf.accountId
                  message: spec.accountId is immutable
              properties:
                accountId: {type: string, minLength: 1}
                username: {type: string, minLength: 1}
                desiredState:
                  type: string
                  enum: [active, offboarding, purge]
                  default: active
                image: {type: string}
                agentRunnerType:
                  type: string
                  enum: [auto_scale, persistent]
                  default: auto_scale
                resources:
                  type: object
                  properties:
                    cpu: {type: number}        # cores; fractional allowed (e.g. 0.5)
                    memoryMb: {type: integer}  # interpreted as Mi by the operator
                storageGb: {type: integer}     # per-account volume quota in Gi (backend-enforced; shrink allowed)
                idle:
                  type: object
                  properties:
                    graceSeconds: {type: integer}
                    minAliveAfterWakeSeconds: {type: integer}
                concurrency:
                  type: object
                  properties:
                    maxConcurrentSessions: {type: integer}
                runtimeDefaults:
                  type: object
                  properties:
                    idleGraceSeconds: {type: integer, minimum: 0}
                    minAliveAfterWakeSeconds: {type: integer, minimum: 0}
                    cpuCores: {type: number, exclusiveMinimum: true, minimum: 0}
                    memoryMb: {type: integer, minimum: 1}
                    storageGb: {type: integer, minimum: 1}
                    runnerImage: {type: string, minLength: 1}
                    terminal:
                      type: object
                      properties:
                        resourcePercent: {type: integer, minimum: 0, maximum: 50, multipleOf: 5}
                        maxSessions: {type: integer, minimum: 1, maximum: 20}
                        idleTimeoutSeconds: {type: integer, minimum: 60}
                        maxLifetimeSeconds: {type: integer, minimum: 60}
                        scaleDownGraceSeconds: {type: integer, minimum: 0}
                wake:
                  type: object
                  properties:
                    requestedAt: {type: string}
                terminalWake:
                  type: object
                  properties:
                    requestedAt: {type: string}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
{{- end }}
