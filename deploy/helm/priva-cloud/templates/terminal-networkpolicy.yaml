{{- if .Values.terminalNetworkPolicy.enabled }}
{{- $ns := include "priva-cloud.namespace" . -}}
# Selective destination-side isolation for Terminal. Egress from Terminal is
# intentionally unrestricted: only data-spine, Postgres, Redis, Runner pods and
# other Terminal pods are denied. Standard NetworkPolicy is allow-list based, so
# these ingress policies protect the named destinations without changing access
# to external sites or unrelated in-cluster services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-spine-deny-terminal
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels: {app: data-spine}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: NotIn, values: [terminal]}
        - podSelector:
            matchExpressions:
              - {key: app, operator: DoesNotExist}
      ports: [{port: 50051, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-deny-terminal
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels: {app: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: NotIn, values: [terminal]}
        - podSelector:
            matchExpressions:
              - {key: app, operator: DoesNotExist}
      ports: [{port: 6379, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-deny-tenant-peers
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels: {app: agent-runner}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: NotIn, values: [agent-runner, terminal]}
        - podSelector:
            matchExpressions:
              - {key: app, operator: DoesNotExist}
      ports: [{port: 8091, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: terminal-deny-tenant-peers
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels: {app: terminal}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: NotIn, values: [agent-runner, terminal]}
        - podSelector:
            matchExpressions:
              - {key: app, operator: DoesNotExist}
      ports: [{port: 8092, protocol: TCP}]
{{- end }}
