{{- if .Values.gateway.enabled }}
{{- $ns := include "priva-cloud.namespace" . -}}
# The single edge. agentgateway provisions a proxy Deployment+Service for this Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      port: {{ .Values.gateway.listenerPort }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
# The pool of per-account agent-runner pods. Its EndpointPicker is the control-panel
# ext_proc brain (:9000): agentgateway calls it per request and routes to the returned
# x-gateway-destination-endpoint (the woken account's pod).
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: {{ .Values.gateway.inferencePoolName }}
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: agent-runner
  targetPorts:
    - number: {{ .Values.gateway.runnerTargetPort }}
  endpointPickerRef:
    group: ""
    kind: Service
    name: control-panel
    port:
      number: 9000
    failureMode: FailClose
---
# /api/sandbox/* + /sandbox/docs -> InferencePool (EPP steers to the account's pod);
# everything else (SPAs at / and /sandbox, /admin, /api/auth, /api/admin,
# /api/resource/models) -> control-panel HTTP face. Most-specific path wins.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: priva-routes
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  rules:
    - matches:
        # All agent-runner runtime API under one namespace -> one prefix to the pool
        # (the EPP picks the endpoint; /api/sandbox/health drives the cold-start toasts).
        # /api/resource/models is NOT here — a control-plane proxy on the "/" catch-all.
        # /sandbox/docs is also NOT here — control-panel proxies the OpenAPI schema from
        # a ready runner (the GIE/EPP path buffers response bodies ~8KB) -> catch-all.
        - path: {type: PathPrefix, value: /api/sandbox}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: {{ .Values.gateway.inferencePoolName }}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: control-panel
          port: 8080
{{- end }}
