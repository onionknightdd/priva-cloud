{{- $ns := include "priva-cloud.namespace" . -}}
# data-spine — single writer (replicas:1, Recreate), gRPC :50051, SQLite on a RWO PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-spine-data
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.dataSpine.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.dataSpine.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-spine
  namespace: {{ $ns }}
  labels:
    app: data-spine
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.dataSpine.replicas }}
  strategy: {type: Recreate}   # never two pods co-mounting the RWO PVC
  selector:
    matchLabels: {app: data-spine}
  template:
    metadata:
      annotations:
        # Roll when the identity/credential Secrets change. Env-injected Secrets
        # are read once at container start, so without this an upgrade that
        # re-keys anything leaves old and new pods signing/verifying with
        # different material until something else happens to restart them.
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels: {app: data-spine}
    spec:
      securityContext:
        # Matches USER 10001 in the image. fsGroup makes mounted volumes (e.g.
        # data-spine's PVC) group-writable for the non-root uid.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- include "priva-cloud.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: data-spine
          image: {{ include "priva-cloud.image" (dict "svc" .Values.services.dataSpine "root" .) }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "priva_data_spine", "serve"]
          ports: [{containerPort: 50051, name: grpc}]
          env:
            # Explicit, to override the K8s-injected DATA_SPINE_PORT=tcp://... service
            # var (which the entry would otherwise int()-parse and crash on).
            - {name: DATA_SPINE_HOST, value: "0.0.0.0"}
            - {name: DATA_SPINE_PORT, value: "50051"}
            - {name: PRIVA_DATASPINE__SQLITE_PATH, value: "/data/priva.dataspine.db"}
            {{- if eq .Values.dataSpine.backend "postgres" }}
            # Postgres backend. The sqlite path above stays valid — it is the
            # migrate-to-pg source and the rollback target.
            - {name: PRIVA_DATASPINE__BACKEND, value: "postgres"}
            - name: PRIVA_DATASPINE__POSTGRES_DSN
              {{- if .Values.dataSpine.postgresDsn }}
              value: {{ .Values.dataSpine.postgresDsn | quote }}
              {{- else }}
              valueFrom: {secretKeyRef: {name: postgres-secret, key: DATA_SPINE_PG_DSN}}
              {{- end }}
            {{- end }}
            - {name: PRIVA_LOG_DIR, value: "/tmp/logs"}
            - {name: PRIVA_SERVER__WORK_DIR, value: "/data"}
          envFrom:
            # hmac (api_key_lookup index) + fernet (at-rest credential encryption).
            # NOT the signing key: data-spine verifies service tokens, never mints.
            - secretRef: {name: priva-data-spine-secret}
          volumeMounts: [{name: data, mountPath: /data}]
          {{- with .Values.dataSpine.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket: {port: 50051}
            initialDelaySeconds: 2
            periodSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data-spine-data}
---
apiVersion: v1
kind: Service
metadata:
  name: data-spine
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  selector: {app: data-spine}
  ports: [{port: 50051, targetPort: 50051, name: grpc}]
