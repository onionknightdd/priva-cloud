{{- $ns := include "priva-cloud.namespace" . -}}
{{- if ne (int .Values.services.operator.replicas) 1 -}}
{{- fail "services.operator.replicas must be exactly 1: the standalone operator has no cross-pod leader election" -}}
{{- end -}}
# operator — kopf AgentTenant controller (sole scaler 0<->1). Logs to stderr.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: {{ $ns }}
  labels:
    app: operator
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.operator.replicas }}
  strategy: {type: Recreate}   # a single active controller (no peering)
  selector:
    matchLabels: {app: operator}
  template:
    metadata:
      annotations:
        # Roll when the identity/credential Secrets change. Env-injected Secrets
        # are read once at container start, so without this an upgrade that
        # re-keys anything leaves old and new pods signing/verifying with
        # different material until something else happens to restart them.
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        # envFrom values are captured at process start. Egress CIDRs, DNS and
        # proxy settings must take effect on the same Helm upgrade that changes
        # priva-config; otherwise the operator keeps rendering the old boundary.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels: {app: operator}
    spec:
      securityContext:
        # Matches USER 10001 in the image. fsGroup makes mounted volumes (e.g.
        # data-spine's PVC) group-writable for the non-root uid.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- include "priva-cloud.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: priva-operator
      containers:
        - name: operator
          image: {{ include "priva-cloud.image" (dict "svc" .Values.services.operator "root" .) }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "priva_operator"]
          env:
            # Workload identity presented to data-spine / the scheduler API.
            - name: PRIVA_SERVICE_IDENTITY__SERVICE_NAME
              value: "operator"
          envFrom:
            - configMapRef: {name: {{ .Values.config.name }}}
            - secretRef: {name: {{ .Values.sharedSecret.name }}}
          {{- with .Values.operator.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
