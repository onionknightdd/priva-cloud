{{- $ns := include "priva-cloud.namespace" . -}}
# scheduler — leaderless firing engine. replicas is a KNOB, not a code change:
# every replica arms the same job set; the Postgres job_fire claim dedupes
# fires, so N>1 is pure availability. No PVC — the DB is the only state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: {{ $ns }}
  labels:
    app: scheduler
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.services.scheduler.replicas }}
  selector:
    matchLabels: {app: scheduler}
  template:
    metadata:
      annotations:
        # Roll when the identity/credential Secrets change. Env-injected Secrets
        # are read once at container start, so without this an upgrade that
        # re-keys anything leaves old and new pods signing/verifying with
        # different material until something else happens to restart them.
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels: {app: scheduler}
    spec:
      securityContext:
        # Matches USER 10001 in the image. fsGroup makes mounted volumes (e.g.
        # data-spine's PVC) group-writable for the non-root uid.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- include "priva-cloud.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: priva-scheduler
      containers:
        - name: scheduler
          image: {{ include "priva-cloud.image" (dict "svc" .Values.services.scheduler "root" .) }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "priva_scheduler"]
          ports: [{containerPort: 8082, name: http}]
          env:
            # Workload identity presented to data-spine / the scheduler API.
            - {name: PRIVA_SERVICE_IDENTITY__SERVICE_NAME, value: "scheduler"}
            - {name: SCHEDULER_HOST, value: "0.0.0.0"}
            - {name: SCHEDULER_PORT, value: "8082"}
            - {name: PRIVA_LOG_DIR, value: {{ .Values.config.logDir | quote }}}
            # data-plane CLIENT only — gRPC to data-spine, never a repo/DSN here.
            - {name: PRIVA_DATASPINE__TRANSPORT, value: "grpc"}
            - {name: PRIVA_DATASPINE__GRPC_DSN, value: "data-spine:50051"}
          envFrom:
            - configMapRef: {name: {{ .Values.config.name }}}
            # service_identity private key: mints the same runner tokens the
            # control-panel edge mints (the pod pins them to its account).
            - secretRef: {name: {{ .Values.sharedSecret.name }}}
          {{- with .Values.scheduler.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: 8082}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8082}
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  selector: {app: scheduler}
  ports: [{port: 8082, targetPort: 8082, name: http}]
