{{- if .Values.sharedSecret.create }}
{{- $ns := include "priva-cloud.namespace" . -}}
{{- /* Three Secrets, one per trust scope. They used to be one Secret that every
       service (and, worse, every tenant runner) envFrom'd wholesale, so a single
       leaked value forged platform logins AND reproduced api-key lookups.
       Each key below now goes only to the workloads whose code actually reads it:

         signing key  -> control-panel / operator / scheduler / channel-connector
                         (the token minters; the runner gets only the public half)
         jwt secret   -> control-panel  (platform login JWTs; nothing else signs them)
         hmac + fernet-> data-spine     (the only process that indexes or decrypts) */ -}}
{{- $existing := (lookup "v1" "Secret" $ns .Values.sharedSecret.name) -}}
{{- $cpExisting := (lookup "v1" "Secret" $ns "priva-control-panel-secret") -}}
{{- $dsExisting := (lookup "v1" "Secret" $ns "priva-data-spine-secret") -}}

{{- /* Values win; then the split Secret; then the legacy combined Secret (so an
       upgrade from the pre-split layout keeps every existing value); then generate. */ -}}
{{- $jwt := .Values.sharedSecret.jwtSecret -}}
{{- if and (not $jwt) $cpExisting -}}{{- $jwt = (index $cpExisting.data "PRIVA_AUTH__JWT_SECRET" | default "" | b64dec) -}}{{- end -}}
{{- if and (not $jwt) $existing -}}{{- $jwt = (index $existing.data "PRIVA_AUTH__JWT_SECRET" | default "" | b64dec) -}}{{- end -}}
{{- $jwt = $jwt | default (randAlphaNum 64) -}}
{{- if lt (len $jwt) 32 -}}
  {{- fail "sharedSecret.jwtSecret must be at least 32 bytes for HS256" -}}
{{- end -}}

{{- $hmac := .Values.sharedSecret.apiKeyHmacSecret -}}
{{- if and (not $hmac) $dsExisting -}}{{- $hmac = (index $dsExisting.data "PRIVA_DATASPINE__API_KEY_HMAC_SECRET" | default "" | b64dec) -}}{{- end -}}
{{- if and (not $hmac) $existing -}}{{- $hmac = (index $existing.data "PRIVA_DATASPINE__API_KEY_HMAC_SECRET" | default "" | b64dec) -}}{{- end -}}
{{- $hmac = $hmac | default (randAlphaNum 64) -}}

{{- /* Signing keypair. Sprig cannot export the public half of genPrivateKey, so
       genSelfSignedCert is used instead: its Key is the signer and its Cert
       carries the public key (priva_common.service_identity extracts the SPKI).
       BOTH halves are generated in one call and preserved together — reusing one
       half while regenerating the other would leave every peer unable to verify
       anything, so they are kept side by side in this Secret and only the public
       half is copied to the verify-only workloads. */ -}}
{{- $signing := .Values.sharedSecret.serviceIdentityPrivateKey -}}
{{- $verify := .Values.sharedSecret.serviceIdentityPublicKey | default "" -}}
{{- $additionalVerify := .Values.sharedSecret.serviceIdentityAdditionalPublicKeys | default (list) | toJson -}}
{{- if and $signing (not $verify) -}}
  {{- fail "sharedSecret.serviceIdentityPrivateKey was supplied without sharedSecret.serviceIdentityPublicKey. The verify-only pods (data-spine) would have nothing to trust. Derive it with: openssl pkey -in <key.pem> -pubout" -}}
{{- end -}}
{{- if and $verify (not $signing) -}}
  {{- fail "sharedSecret.serviceIdentityPublicKey was supplied without sharedSecret.serviceIdentityPrivateKey; supply both or neither" -}}
{{- end -}}
{{- if and (not $signing) $existing -}}
  {{- $priorKey := (index $existing.data "PRIVA_SERVICE_IDENTITY__PRIVATE_KEY" | default "" | b64dec) -}}
  {{- $priorPub := (index $existing.data "PRIVA_SERVICE_IDENTITY__PUBLIC_KEY" | default "" | b64dec) -}}
  {{- if and $priorKey $priorPub -}}
    {{- $signing = $priorKey -}}{{- $verify = $priorPub -}}
  {{- else if $priorKey -}}
    {{- /* Upgrading from a revision that stored only the private half. Silently
           generating a fresh pair here would re-key the whole cluster mid-upgrade
           and strand every already-issued token, so stop and make it a decision:
           derive the public half from the key already in the Secret and pass both
           back in as values. */ -}}
    {{- fail "priva-shared-secret holds a private key with no PRIVA_SERVICE_IDENTITY__PUBLIC_KEY. Refusing to silently generate a new keypair. Recover the existing one:\n  kubectl -n <ns> get secret priva-shared-secret -o jsonpath='{.data.PRIVA_SERVICE_IDENTITY__PRIVATE_KEY}' | base64 -d > k.pem\n  openssl pkey -in k.pem -pubout > pub.pem\nthen re-run with --set-file sharedSecret.serviceIdentityPrivateKey=k.pem --set-file sharedSecret.serviceIdentityPublicKey=pub.pem" -}}
  {{- end -}}
{{- end -}}
{{- if not $signing -}}
  {{- /* Fresh install: one call yields both halves. Sprig cannot export the
         public half of genPrivateKey, so the Cert is the carrier and
         priva_common.service_identity extracts the SPKI. */ -}}
  {{- $pair := genSelfSignedCert "priva-service-identity" nil nil 3650 -}}
  {{- $signing = $pair.Key -}}{{- $verify = $pair.Cert -}}
{{- end -}}

{{- /* At-rest credential encryption (account.api_key, feishu app_secret). Absent,
       priva_common.crypto refuses to encrypt rather than fall back to the PUBLIC
       dev key committed in this repo. 32 alnum bytes b64-encoded is a valid
       Fernet key. */ -}}
{{- $fernet := .Values.sharedSecret.fernetKey -}}
{{- if and (not $fernet) $dsExisting -}}{{- $fernet = (index $dsExisting.data "PRIVA_FERNET_KEY" | default "" | b64dec) -}}{{- end -}}
{{- if and (not $fernet) $existing -}}{{- $fernet = (index $existing.data "PRIVA_FERNET_KEY" | default "" | b64dec) -}}{{- end -}}
{{- $fernet = $fernet | default (randAlphaNum 32 | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.sharedSecret.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
  annotations:
    # Generated on first install and preserved on upgrade (lookup). Rotate only
    # with the documented additional-public-key overlap window.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  # MUST NOT be mounted into an agent-runner: it mints tokens for ANY account.
  # envFrom-ing this Secret into the runner is what put platform signing material
  # in reach of tenant code.
  PRIVA_SERVICE_IDENTITY__PRIVATE_KEY: {{ $signing | quote }}
  # Kept beside its private half so an upgrade can never preserve one and
  # regenerate the other. Public by definition — copied, not guarded.
  PRIVA_SERVICE_IDENTITY__PUBLIC_KEY: {{ $verify | quote }}
  # JSON list consumed by pydantic-settings. These are verification-only
  # future/previous keys for an explicit rotation overlap window.
  PRIVA_SERVICE_IDENTITY__ADDITIONAL_PUBLIC_KEYS: {{ $additionalVerify | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: priva-control-panel-secret
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
  annotations:
    # Rotating this invalidates all live login sessions.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  PRIVA_AUTH__JWT_SECRET: {{ $jwt | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: priva-data-spine-secret
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
  annotations:
    # Rotating the HMAC secret invalidates the api_key_lookup index (re-hash
    # needed); rotating the Fernet key makes existing ciphertext unreadable
    # until re-encrypted — move the old value into PRIVA_FERNET_KEYS_OLD first.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  PRIVA_DATASPINE__API_KEY_HMAC_SECRET: {{ $hmac | quote }}
  PRIVA_FERNET_KEY: {{ $fernet | quote }}
  # Verify-only: data-spine authenticates every caller's service token but never
  # mints one, so it gets the public half and NOT the signing key.
  PRIVA_SERVICE_IDENTITY__PUBLIC_KEY: {{ $verify | quote }}
  PRIVA_SERVICE_IDENTITY__ADDITIONAL_PUBLIC_KEYS: {{ $additionalVerify | quote }}
{{- end }}
