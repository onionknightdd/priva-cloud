{{- $ns := include "priva-cloud.namespace" . -}}
# Static default-deny baselines. Kubernetes unions allows from every matching
# NetworkPolicy, so the operator's managed policies add the current permitted
# paths. If those dynamic objects are deleted or the operator is unavailable,
# these independent Helm-owned objects keep tenant/proxy pods isolated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: priva-tenant-runner-baseline
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
    priva.io/policy-set: tenant-isolation-baseline
spec:
  podSelector:
    matchLabels:
      app: agent-runner
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: priva-tenant-terminal-baseline
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
    priva.io/policy-set: tenant-isolation-baseline
spec:
  podSelector:
    matchLabels:
      app: terminal
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: priva-tenant-egress-proxy-baseline
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
    priva.io/policy-set: tenant-isolation-baseline
spec:
  podSelector:
    matchLabels:
      app: egress-proxy
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
