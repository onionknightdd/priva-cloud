{{- if .Values.postgres.enabled }}
{{- $ns := include "priva-cloud.namespace" . -}}
{{- /* Preserve the generated password across upgrades (same idiom as sharedSecret). */ -}}
{{- $existing := (lookup "v1" "Secret" $ns "postgres-secret") -}}
{{- $pw := .Values.postgres.password -}}
{{- if and (not $pw) $existing -}}{{- $pw = (index $existing.data "POSTGRES_PASSWORD" | b64dec) -}}{{- end -}}
{{- $pw = $pw | default (randAlphaNum 32) -}}
{{- $dsn := printf "postgresql://%s:%s@postgres.%s.svc.cluster.local:5432/%s" .Values.postgres.username $pw $ns .Values.postgres.database -}}
# postgres — the data-spine Postgres backend (dataSpine.backend=postgres).
# Single instance, RWO PVC on the cluster-default (local/block) StorageClass —
# NEVER the NFS export (PG data files over NFS = locking/corruption pain).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
  annotations:
    # Generated on first install and preserved on upgrade (lookup). The DSN is
    # consumed by the data-spine pod ONLY — never mount it anywhere else.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pw | quote }}
  DATA_SPINE_PG_DSN: {{ $dsn | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.postgres.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels:
    app: postgres
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}   # never two pods co-mounting the RWO PVC
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      {{- include "priva-cloud.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 5432, name: pg}]
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgres.username | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}
            # Subdir of the mount: initdb refuses a datadir with lost+found in it.
            - {name: PGDATA, value: "/var/lib/postgresql/data/pgdata"}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          {{- with .Values.postgres.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432, name: pg}]
---
# Only the data-spine pod may reach Postgres: the DSN carries DB credentials and
# tenant runner pods share this namespace (their env is user-visible via the web
# terminal). Enforcement requires a NetworkPolicy-capable CNI (minikube's default
# kindnet does NOT enforce; declared for parity with enforcing clusters).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-only-data-spine
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: data-spine}
      ports:
        - {port: 5432, protocol: TCP}
{{- end }}
