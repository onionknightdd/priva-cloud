{{- if .Values.channelConnector.enabled }}
{{- $ns := include "priva-cloud.namespace" . -}}
# channel-connector — always-on Feishu WS byte-path. Holds one lark_oapi
# long-connection per effective account (thread-per-app) and relays DM ⇄ ar pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel-connector
  namespace: {{ $ns }}
  labels:
    app: channel-connector
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  # replicas is deliberately NOT a values knob: the same Feishu app must hold
  # exactly ONE active WS — a second connection single-casts and splits events.
  # Hard single replica with maxSurge=0 (never two connectors overlapping);
  # HA needs a Redis lease before N>1.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}   # never two connectors at once (single-cast)
  selector:
    matchLabels: {app: channel-connector}
  template:
    metadata:
      annotations:
        # Roll when the identity/credential Secrets change. Env-injected Secrets
        # are read once at container start, so without this an upgrade that
        # re-keys anything leaves old and new pods signing/verifying with
        # different material until something else happens to restart them.
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels: {app: channel-connector}
    spec:
      securityContext:
        # Matches USER 10001 in the image. fsGroup makes mounted volumes (e.g.
        # data-spine's PVC) group-writable for the non-root uid.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- include "priva-cloud.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: priva-channel-connector
      terminationGracePeriodSeconds: 40   # let SIGTERM close all WS before the kill
      containers:
        - name: channel-connector
          image: {{ include "priva-cloud.image" (dict "svc" .Values.services.channelConnector "root" .) }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "priva_channel_connector"]
          ports: [{containerPort: 8083, name: http}]
          env:
            # Workload identity presented to data-spine / the scheduler API.
            - {name: PRIVA_SERVICE_IDENTITY__SERVICE_NAME, value: "channel-connector"}
            - {name: CONNECTOR_HOST, value: "0.0.0.0"}
            - {name: CONNECTOR_PORT, value: "8083"}
            - {name: CONNECTOR_POLL_SECONDS, value: "10"}
            - {name: PRIVA_LOG_DIR, value: {{ .Values.config.logDir | quote }}}
            # data-plane CLIENT only — gRPC to data-spine, never a repo/DSN here.
            - {name: PRIVA_DATASPINE__TRANSPORT, value: "grpc"}
            - {name: PRIVA_DATASPINE__GRPC_DSN, value: "data-spine:50051"}
          envFrom:
            - configMapRef: {name: {{ .Values.config.name }}}
            # service_identity private key: mints runner tokens to dial ar pods AND
            # verifies the control-panel's push nudge. (No PRIVA_FERNET_KEY — the connector
            # never decrypts; data-spine returns the plaintext app_secret over gRPC.)
            - secretRef: {name: {{ .Values.sharedSecret.name }}}
          {{- with .Values.channelConnector.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: 8083}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8083}
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: channel-connector
  namespace: {{ $ns }}
  labels:
    {{- include "priva-cloud.labels" . | nindent 4 }}
spec:
  selector: {app: channel-connector}
  ports: [{port: 8083, targetPort: 8083, name: http}]
{{- end }}
