syntax = "proto3";

package priva.dataplane.v1;

import "priva_common/dataplane/v1/common.proto";

// scheduled_job — `trigger` and `job_config` are JSON strings on the wire.
message Job {
  string job_id = 1;
  string account_id = 2;
  string name = 3;
  string prompt = 4;        // legacy mirror of job_config.prompt
  string trigger = 5;       // JSON: {type:interval,...} | {type:cron,expr}
  string job_type = 6;      // agent_run | http_call | user_script | tool_retry
  string job_config = 7;    // JSON discriminated union
  string timezone = 8;
  string model = 9;
  string status = 10;       // active | paused
  string created_at = 11;
  string updated_at = 12;
}

message JobRef { string job_id = 1; }
message JobList { repeated Job jobs = 1; }

message CreateJobRequest {
  string account_id = 1;
  string name = 2;
  string prompt = 3;
  string trigger = 4;
  string job_type = 5;
  string job_config = 6;
  string timezone = 7;
  string model = 8;
  string status = 9;
  string job_id = 10;       // caller-minted (parity with the in-process client); server mints if empty
}

message UpdateJobRequest {
  string job_id = 1;
  string name = 2;
  string prompt = 3;
  string trigger = 4;
  string job_type = 5;
  string job_config = 6;
  string timezone = 7;
  string model = 8;
  string status = 9;
  repeated string update_mask = 10;
}

message SetJobStatusRequest {
  string job_id = 1;
  string status = 2;
}

// job_run_record — metadata only (output transcript stays on PV).
message Run {
  string run_id = 1;
  string job_id = 2;
  string job_name = 3;
  string account_id = 4;
  string session_id = 5;
  string started_at = 6;
  string finished_at = 7;
  string status = 8;        // running|success|error|cancelled|skipped
  int64 duration_ms = 9;
  bool is_error = 10;
  string error_message = 11;
  int64 num_turns = 12;
  string result_summary = 13;
}

message StartRunRequest {
  string run_id = 1;
  string job_id = 2;
  string job_name = 3;
  string account_id = 4;
  string session_id = 5;
  string started_at = 6;
  string status = 7;        // running | skipped
  string error_message = 8; // skip reason when status=skipped (D11)
}

message RunRef {
  string account_id = 1;    // ownership check — a run is only visible to its account
  string run_id = 2;
}

message LatestRunRef {
  string account_id = 1;
  string job_id = 2;
}

message DeleteRunsBeforeRequest {
  string account_id = 1;
  string cutoff_date = 2;   // ISO date/datetime; lexicographic cutoff on started_at
}

message RunIdList { repeated string run_ids = 1; }

// job_fire — the leaderless exactly-once claim: INSERT-wins on the composite
// PK (job_id, fire_epoch). fire_epoch is the trigger's SCHEDULED instant so
// every replica computes the same key for the same fire.
message ClaimFireRequest {
  string job_id = 1;
  int64 fire_epoch = 2;
  string claimed_by = 3;    // replica id (pod name)
}

message ClaimFireResponse { bool claimed = 1; }

message PruneFiresRequest { string cutoff = 1; }  // ISO cutoff on claimed_at

message FinishRunRequest {
  string run_id = 1;
  string finished_at = 2;
  string status = 3;
  int64 duration_ms = 4;
  bool is_error = 5;
  string error_message = 6;
  int64 num_turns = 7;
  string result_summary = 8;
  // The pod learns the CLI session id only after dispatch (StartRun carries
  // none), so the outcome write delivers it. Empty = leave unchanged.
  string session_id = 9;
}

message ListRunsRequest {
  string account_id = 1;
  int32 limit = 2;
  string before = 3;   // keyset cursor
  string after = 4;    // keyset cursor
  string job_id = 5;   // filter
  string status = 6;   // filter
}

message RunPage {
  repeated Run runs = 1;
  string next_cursor = 2;
  string prev_cursor = 3;
  int64 total = 4;     // -1 when a filter is active (total unknown)
}

service SchedulerService {
  rpc CreateJob(CreateJobRequest) returns (Job);
  rpc GetJob(JobRef) returns (Job);
  rpc UpdateJob(UpdateJobRequest) returns (Job);
  rpc DeleteJob(JobRef) returns (BoolValue);
  rpc ListJobs(AccountRef) returns (JobList);
  rpc ListActiveJobs(Empty) returns (JobList);
  rpc SetJobStatus(SetJobStatusRequest) returns (Job);
  rpc StartRun(StartRunRequest) returns (Run);
  rpc FinishRun(FinishRunRequest) returns (Run);
  rpc RecordRun(Run) returns (Run);
  rpc GetRun(RunRef) returns (Run);
  rpc GetLatestRun(LatestRunRef) returns (Run);
  rpc ListRuns(ListRunsRequest) returns (RunPage);
  rpc DeleteRunsBefore(DeleteRunsBeforeRequest) returns (RunIdList);
  rpc ClaimJobFire(ClaimFireRequest) returns (ClaimFireResponse);
  rpc PruneFiresBefore(PruneFiresRequest) returns (CountValue);
}
